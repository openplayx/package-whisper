// FFI plugin: compiles src/ with CMake and bundles libopenplayx_whisper.so.
group = "org.openplayx.whisper"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "org.openplayx.whisper"
    compileSdk = 35
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }
    defaultConfig {
        minSdk = 24
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
